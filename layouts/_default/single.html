{{ define "main" }}
<main class="post-wrapper" style="max-width: 800px; margin: 0 auto; padding: 2rem 1rem;">
  
  <header class="post-header" style="margin-bottom: 2rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--color-accent);">{{ .Title }}</h1>
    
    <div class="post-meta" style="color: #888; font-family: 'Fira Code', monospace; font-size: 0.9rem;">
      <time>📅 {{ .Date.Format "2006-01-02" }}</time>
      {{ if .Params.categories }}
        <span style="margin-left: 15px;">📁 分類: 
          {{ range .Params.categories }}
            <span class="meta-category" style="background: rgba(0, 204, 153, 0.1); color: var(--color-accent); padding: 2px 6px; border-radius: 4px; margin-right: 5px;">{{ . }}</span>
          {{ end }}
        </span>
      {{ end }}
    </div>
  </header>

  <hr style="border: 0; border-top: 1px solid #333; margin-bottom: 2rem;">

  <article class="post-content" style="line-height: 1.8; font-size: 1.1rem;">
    {{ .Content }}
  </article>

  {{ if .Params.tags }}
  <footer class="post-footer" style="margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #333;">
    <div class="post-tags">
      {{ range .Params.tags }}
        <span style="color: #888; margin-right: 10px;">#{{ . }}</span>
      {{ end }}
    </div>
  </footer>
  {{ end }}

</main>

<style>
  .post-content img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 2rem auto;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .post-content blockquote {
    border-left: 4px solid var(--color-accent);
    margin: 1.5rem 0;
    padding-left: 1rem;
    color: #aaa;
    font-style: italic;
  }
</style>
{{ end }}
